name: Generar vídeo del canal

on:
  push:
    branches:
      - caspitas-visual-validation
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      video_subject:
        description: 'Tema del vídeo (déjalo vacío para elegir uno sin repetir hasta agotar la lista)'
        required: false
        type: string
        default: ''
concurrency:
  group: caspitas-generacion-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Comprobar que son las 21:00 en España
        id: local_time
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=Europe/Madrid date +%H)" = "21" ]; then
            echo "run_now=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_now=false" >> "$GITHUB_OUTPUT"
            echo "Esta ejecución programada no corresponde a las 21:00 en España; se omite."
          fi

      - name: Descargar el repositorio
        if: steps.local_time.outputs.run_now == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fijar versión estable de MoneyPrinterTurbo
        if: steps.local_time.outputs.run_now == 'true'
        run: git clone --depth 1 --branch v1.3.10 https://github.com/harry0703/MoneyPrinterTurbo.git mpt

      - name: Aplicar controles de duración y optimización FFmpeg
        if: steps.local_time.outputs.run_now == 'true'
        run: |
          python3 scripts/patch_moneyprinter.py
          python3 -m py_compile mpt/app/services/task.py mpt/app/services/video.py

      - name: Instalar Python con caché de dependencias
        if: steps.local_time.outputs.run_now == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mpt/requirements.txt

      - name: Instalar FFmpeg
        if: steps.local_time.outputs.run_now == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Instalar dependencias de MoneyPrinterTurbo
        if: steps.local_time.outputs.run_now == 'true'
        working-directory: mpt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Pillow para crear miniaturas
        if: steps.local_time.outputs.run_now == 'true'
        run: python -m pip install pillow

      - name: Elegir tema sin repetir innecesariamente
        if: steps.local_time.outputs.run_now == 'true'
        env:
          USER_TOPIC: ${{ github.event.inputs.video_subject }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import random
          from pathlib import Path

          user_topic = (os.environ.get("USER_TOPIC") or "").strip()
          selected_id = ""

          if user_topic:
              subject = user_topic
              print("Se utilizará el tema introducido manualmente.")
          else:
              topics = json.loads(Path("data/topics.json").read_text(encoding="utf-8"))
              if not topics:
                  raise SystemExit("data/topics.json no contiene temas.")

              history_path = Path("data/topic_history.json")
              history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else {"used_ids": []}
              used_ids = set(history.get("used_ids", []))
              available = [item for item in topics if item["id"] not in used_ids]

              if not available:
                  print("Se han utilizado todos los temas; comienza un nuevo ciclo.")
                  available = topics

              selected = random.choice(available)
              selected_id = selected["id"]
              subject = selected["video_subject"]
              print(f"Tema seleccionado: {subject}")

          prompt = """
          GUION DOCUMENTAL: 2.300-2.500 palabras en español de España (14-17 minutos); nunca menos de 2.200. Desarrolla con detalle, sin resumir ni repetir.
          ESTRUCTURA: gancho; contexto y protagonistas; cronología; pruebas, documentos y testimonios; hipótesis contrastadas; contradicciones; hechos confirmados y lagunas; consecuencias, estado actual y conclusión razonada.
          RIGOR: no inventes hechos, fechas, nombres, citas, documentos, fuentes ni enlaces. Prioriza fuentes primarias, archivos oficiales y estudios académicos. Atribuye cada hipótesis y separa hechos, teorías, rumores y dudas. Marca como pendiente lo no verificable.
          VALOR: análisis original, contexto específico y educativo. Sugiere mapas, cronologías y recursos visuales pertinentes; evita repetir clips.
          VISUAL CASPITAS: ilustraciones 2D de cómic/storyboard con contornos limpios, personajes expresivos (nunca stickman), fondos completos, profundidad, sombras e iluminación cinematográfica. En secuencias, conserva identidad, ropa, proporciones y accesorios; cambia poses y planos. Usa tonos fríos y acentos cálidos. Alterna ilustración con fotos, vídeo documental, mapas y documentos reales; cada recurso debe corresponder a la época y al hecho narrado. Sin marcas de agua ni texto ilegible.
          ESTILO: serio, inmersivo y natural. Sin saludos ni instrucciones al editor. Trata tragedias con respeto y sin morbo. No presentes conspiraciones como hechos.
          DERECHOS: no presupongas licencias comerciales de voz, música o imágenes; evita música sin licencia documentada.
          """

          Path("topic_subject.txt").write_text(subject, encoding="utf-8")
          Path("topic_prompt.txt").write_text(prompt, encoding="utf-8")
          Path("selected_topic_id.txt").write_text(selected_id, encoding="utf-8")
          PY

      - name: Validar límite de prompt de MoneyPrinterTurbo
        if: steps.local_time.outputs.run_now == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          prompt = Path("topic_prompt.txt").read_text(encoding="utf-8")
          length = len(prompt)
          print(f"video_script_prompt: {length}/2000 caracteres")
          if length > 2000:
              raise SystemExit("El prompt supera el límite de 2.000 caracteres de MoneyPrinterTurbo.")
          PY

      - name: Verificar secretos necesarios
        if: steps.local_time.outputs.run_now == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
        run: |
          if [ -z "$UPLOAD_POST_API_KEY" ]; then
            echo "::error::Falta el secreto UPLOAD_POST_API_KEY. Añádelo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Configura al menos un proveedor de IA: GEMINI_API_KEY u OPENROUTER_API_KEY."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Gemini no está configurado; se utilizará OpenRouter."
          else
            echo "Gemini está configurado; OpenRouter podrá actuar como respaldo."
          fi
          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "::error::Falta el secreto PIXABAY_API_KEY en GitHub Actions."
            exit 1
          fi
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "OpenRouter está configurado como proveedor alternativo."
          else
            echo "Aviso: OPENROUTER_API_KEY no está configurado; solo se probará Gemini."
          fi
          echo "Los secretos necesarios están configurados (valores ocultos)."

      - name: Crear configuración privada
        if: steps.local_time.outputs.run_now == 'true'
        working-directory: mpt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          umask 077
          cat > config.toml <<EOF
          [app]
          video_source = "pixabay"
          pixabay_api_keys = ["${PIXABAY_API_KEY}"]
          llm_provider = "gemini"
          gemini_api_key = "${GEMINI_API_KEY}"
          gemini_model_name = "gemini-3.8-flash"
          openrouter_api_key = "${OPENROUTER_API_KEY}"
          openrouter_base_url = "https://openrouter.ai/api/v1"
          openrouter_model_name = "nvidia/nemotron-3-ultra-550b-a55b:free"
          subtitle_provider = "edge"
          edge_tts_timeout = 600
          ffmpeg_concat_timeout_seconds = 7200
          material_concurrency = 2
          video_clip_concurrency = 2
          EOF
          chmod 600 config.toml

      - name: Generar documental con Gemini y respaldo OpenRouter
        if: steps.local_time.outputs.run_now == 'true'
        working-directory: mpt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          success=false
          selected_provider=""
          selected_model=""
          : > ../generation.log

          run_generation() {
            local provider="$1"
            local model="$2"
            local config_key="$3"

            echo "Intentando generar con proveedor: $provider | modelo: $model"
            python3 - "$provider" "$model" "$config_key" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          provider, model, config_key = sys.argv[1:4]
          path = Path("config.toml")
          config = path.read_text(encoding="utf-8")
          replacements = {"llm_provider": provider, config_key: model}
          for key, value in replacements.items():
              pattern = rf"(?m)^{re.escape(key)}\s*=.*$"
              config, count = re.subn(pattern, f"{key} = {json.dumps(value)}", config, count=1)
              if count != 1:
                  raise SystemExit(f"No se encontró exactamente una línea para {key}")
          path.write_text(config, encoding="utf-8")
          PY

            # Cada proveedor parte de un directorio limpio para no confundir un MP4
            # incompleto de un intento anterior con el resultado del intento actual.
            mkdir -p storage/tasks
            find storage/tasks -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            set +e
            timeout --signal=TERM --kill-after=60s 150m python3 cli.py \
              --video-subject "$(cat ../topic_subject.txt)" \
              --video-script-prompt "$(cat ../topic_prompt.txt)" \
              --video-source pixabay \
              --video-language es-ES \
              --voice-name "es-ES-AlvaroNeural" \
              --voice-rate 0.95 \
              --paragraph-number 10 \
              --video-aspect "16:9" \
              --video-fit-mode "cover" \
              --video-clip-duration 6 \
              --video-transition-mode "fade-in" \
              --bgm-type none \
              --bgm-volume 0 \
              --subtitle-enabled \
              --subtitle-display-mode word_by_word \
              --subtitle-animation none \
              --font-size 54 \
              --text-fore-color "#FFE36E" \
              --stroke-color "#171717" \
              --stroke-width 3 \
              --subtitle-position bottom \
              --subtitle-background-enabled \
              --subtitle-background-color "#171717" \
              --rounded-subtitle-background \
              --n-threads 2 \
              --match-materials-to-script \
              --stop-at video 2>&1 | tee -a ../generation.log
            local status=${PIPESTATUS[0]}
            set -e

            # No basta con que MoneyPrinterTurbo devuelva código 0: también
            # exigimos un MP4 nuevo y con duración mínima antes de aceptar el modelo.
            if [ "$status" -eq 0 ]; then
              video="$(find storage/tasks -type f -name '*.mp4' -size +1M -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
              if [ -z "$video" ] || [ ! -f "$video" ]; then
                echo "El proveedor terminó sin crear un MP4 válido."
                status=3
              else
                duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video" 2>/dev/null || echo 0)"
                if python3 - "$duration" <<'PY'
          import sys
          seconds = float(sys.argv[1])
          print(f"Duración del intento: {seconds / 60:.1f} minutos")
          if seconds < 600:
              raise SystemExit("Duración inferior a 10 minutos; se probará el siguiente proveedor/modelo.")
          PY
                then
                  echo "Generación válida completada con $provider ($model)."
                  selected_provider="$provider"
                  selected_model="$model"
                  success=true
                  return 0
                else
                  status=4
                fi
              fi
            fi

            echo "El intento con $provider ($model) ha fallado (código $status)."
            if [ "$status" -eq 124 ]; then
              echo "::error::Timeout del proceso completo. No se repetirá la generación con otro modelo porque el fallo se ha producido durante el procesamiento/renderizado, no necesariamente al generar el guion."
            fi
            return "$status"
          }

          # Se prueban dos modelos Gemini; si fallan o generan un vídeo demasiado corto,
          # se pasa a OpenRouter, que es independiente de la infraestructura Google.
          status=1
          if [ -n "$GEMINI_API_KEY" ]; then
            for model in gemini-3.5-flash-lite gemini-3.8-flash; do
              if run_generation "gemini" "$model" "gemini_model_name"; then
                break
              else
                status=$?
                if [ "$status" -eq 124 ]; then
                  echo "Se detiene el fallback: el intento agotó su tiempo durante el procesamiento."
                  break
                fi
              fi
              if [ "$model" != "gemini-3.8-flash" ]; then
                echo "Esperando 45 segundos antes del siguiente intento Gemini..."
                sleep 45
              fi
            done
          else
            echo "No hay clave Gemini; se omitirá Gemini y se probará OpenRouter directamente."
          fi

          if [ "$success" != "true" ] && [ "${status:-0}" -ne 124 ] && [ -n "$OPENROUTER_API_KEY" ]; then
            echo "Gemini no ha podido completar la generación. Activando OpenRouter..."
            run_generation "openrouter" "nvidia/nemotron-3-ultra-550b-a55b:free" "openrouter_model_name" || true
          fi

          if [ "$success" != "true" ]; then
            echo "::error::No se pudo generar el documental con Gemini ni con OpenRouter. Revisa generation.log."
            exit 1
          fi

          printf '%s\n' "$selected_provider" > ../selected_provider.txt
          printf '%s\n' "$selected_model" > ../selected_model.txt

      - name: Revisar MP4, duración, pistas y sincronización de subtítulos
        if: steps.local_time.outputs.run_now == 'true'
        working-directory: mpt
        run: |
          set -euo pipefail
          video="$(find storage/tasks -type f -name '*.mp4' -size +1M -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$video" ] || [ ! -f "$video" ]; then
            echo "::error::No hay un MP4 que pueda pasar el control de calidad."
            exit 1
          fi
          mkdir -p ../output
          python3 ../scripts/validate_video.py "$video" --report ../output/qa_report.json
          task_dir="$(dirname "$video")"
          cp "$task_dir/subtitle.srt" ../output/subtitles.srt
          # The downstream validators need the original narration and SRT beside each rendered MP4.
          cp "$task_dir/subtitle.srt" ../output/subtitle.srt
          cp "$task_dir/audio.mp3" ../output/audio.mp3
          cp ../generation.log ../output/generation.log

      - name: Validar duración y preparar el vídeo final
        id: prepared_video
        if: steps.local_time.outputs.run_now == 'true'
        working-directory: mpt
        run: |
          set -euo pipefail
          video="$(find storage/tasks -type f -name '*.mp4' -size +1M -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$video" ] || [ ! -f "$video" ]; then
            echo "::error::MoneyPrinterTurbo terminó sin producir un MP4 válido."
            exit 1
          fi

          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")"
          python3 - "$duration" <<'PY'
          import sys
          seconds = float(sys.argv[1])
          print(f"Duración detectada: {seconds / 60:.1f} minutos")
          if seconds < 600:
              raise SystemExit("El vídeo dura menos de 10 minutos; no se considera listo para publicar.")
          if not 600 <= seconds <= 1020:
              print("AVISO: la duración queda fuera del objetivo de 14-17 minutos.")
          PY

          mkdir -p ../output
          final="../output/Caspitas-$(TZ=Europe/Madrid date +%Y-%m-%d)-$GITHUB_RUN_NUMBER.mp4"
          cp "$video" "$final"
          printf '%s\n' "$duration" > ../output/duration_seconds.txt
          printf '%s\n' "$(cat ../topic_subject.txt)" > ../output/tema.txt
          printf '%s | %s\n' "$(cat ../selected_provider.txt)" "$(cat ../selected_model.txt)" > ../output/modelo.txt
          echo "video_path=output/$(basename "$final")" >> "$GITHUB_OUTPUT"
          echo "topic=$(cat ../topic_subject.txt)" >> "$GITHUB_OUTPUT"
          script_file="$(find storage/tasks -type f -iname '*script*.txt' -size +2k -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$script_file" ]; then
            script_file="$(find storage/tasks -type f -iname '*.srt' -size +2k -printf '%s %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          fi
          if [ -n "$script_file" ] && [ -f "$script_file" ]; then
            cp "$script_file" ../output/script_source.txt
            echo "Se ha localizado el guion/subtítulo para crear metadatos basados en el contenido."
          else
            printf '%s\n' "$(cat ../topic_subject.txt)" > ../output/script_source.txt
            echo "::warning::No se ha localizado el texto del guion; los metadatos usarán el tema como respaldo."
          fi
          echo "Vídeo validado y preparado: $final"

      - name: Guardar tema en el historial para evitar repeticiones
        if: steps.local_time.outputs.run_now == 'true' && success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          topic_id="$(cat selected_topic_id.txt)"
          if [ -n "$topic_id" ]; then
            python3 scripts/update_topic_history.py "$topic_id"
          else
            echo "Tema introducido manualmente; no se modifica el historial automático."
          fi

      - name: Instalar herramientas del motor visual híbrido
        if: steps.local_time.outputs.run_now == 'true'
        run: python -m pip install pillow yt-dlp

      - name: Analizar referencias visuales públicas del tema
        if: steps.local_time.outputs.run_now == 'true' && success()
        run: |
          set -euo pipefail
          python3 scripts/competitor_benchmark.py \
            --topic "$(cat output/tema.txt)" \
            --output output/competitor_benchmark.json

      - name: Crear storyboard semántico con continuidad visual Caspitas
        if: steps.local_time.outputs.run_now == 'true' && success()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/semantic_storyboard.py
          python3 scripts/semantic_storyboard.py \
            --srt output/subtitles.srt \
            --topic "$(cat output/tema.txt)" \
            --benchmark output/competitor_benchmark.json \
            --output output/semantic_storyboard.json

      - name: Buscar mapas y material documental con licencia identificable
        if: steps.local_time.outputs.run_now == 'true' && success()
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/research_visual_assets.py
          python3 scripts/research_visual_assets.py \
            --storyboard output/semantic_storyboard.json \
            --output-dir output/visual_assets

      - name: Aplicar ilustraciones cómic y montaje visual híbrido
        id: hybrid_visuals
        if: steps.local_time.outputs.run_now == 'true' && success()
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/hybrid_visual_engine.py
          python3 scripts/hybrid_visual_engine.py \
            --video "${{ steps.prepared_video.outputs.video_path }}" \
            --srt output/subtitles.srt \
            --plan output/semantic_storyboard.json \
            --output output/Caspitas-hybrid.mp4 \
            --storyboard output/storyboard.json \
            --interval 55 \
            --scene-seconds 4.5
          python3 -m py_compile scripts/validate_storyboard.py
          python3 scripts/validate_storyboard.py \
            --storyboard output/storyboard.json \
            --srt output/subtitles.srt \
            --assets-manifest output/visual_assets/visual_asset_manifest.json \
            --report output/storyboard_qa_report.json
          python3 scripts/validate_video.py output/Caspitas-hybrid.mp4 --report output/hybrid_qa_report.json
          echo "video_path=output/Caspitas-hybrid.mp4" >> "$GITHUB_OUTPUT"
          echo "Montaje visual híbrido completado; se conserva el audio original."

      - name: Añadir efectos de sonido originales y validar mezcla
        id: sound_effects
        if: steps.local_time.outputs.run_now == 'true' && success()
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/add_sound_effects.py
          python3 scripts/add_sound_effects.py \
            --video "${{ steps.hybrid_visuals.outputs.video_path }}" \
            --storyboard output/storyboard.json \
            --output output/Caspitas-final-sfx.mp4
          python3 scripts/validate_video.py output/Caspitas-final-sfx.mp4 --report output/sfx_qa_report.json
          echo "video_path=output/Caspitas-final-sfx.mp4" >> "$GITHUB_OUTPUT"
          echo "Efectos de sonido añadidos; voz y duración comprobadas."

      - name: Renderizar subtítulos por frases con resaltado de palabra activa
        id: karaoke_subtitles
        if: steps.local_time.outputs.run_now == 'true' && success()
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/phrase_karaoke_subtitles.py
          python3 scripts/phrase_karaoke_subtitles.py \
            --video output/Caspitas-final-sfx.mp4 \
            --srt output/subtitles.srt \
            --ass output/subtitles_karaoke.ass \
            --output output/Caspitas-final-karaoke.mp4 \
            --report output/subtitles_karaoke_report.json
          python3 scripts/validate_video.py output/Caspitas-final-karaoke.mp4 --report output/karaoke_qa_report.json
          echo "video_path=output/Caspitas-final-karaoke.mp4" >> "$GITHUB_OUTPUT"
          echo "Subtítulos por frases con resaltado karaoke renderizados y validados."

      - name: Crear título, descripción y miniatura whiteboard
        id: youtube_assets
        if: steps.local_time.outputs.run_now == 'true' && success()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/create_youtube_assets.py
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path("output/metadata.json").read_text(encoding="utf-8"))
          print("title=" + data["title"].replace("\\n", " ").strip())
          print("title_json=" + json.dumps(data["title"], ensure_ascii=False))
          print("description_json=" + json.dumps(data["description"], ensure_ascii=False))
          print("tags_json=" + json.dumps(data["tags"], ensure_ascii=False))
          print("thumbnail_path=output/thumbnail.png")
          PY

      - name: Calcular publicación para mañana a las 21:00 (hora de España)
        id: publish_time
        if: steps.local_time.outputs.run_now == 'true' && success()
        run: |
          scheduled_date="$(TZ=Europe/Madrid date -d 'tomorrow 21:00' '+%Y-%m-%dT%H:%M:%S')"
          echo "scheduled_date=$scheduled_date" >> "$GITHUB_OUTPUT"
          echo "El documental se programará para $scheduled_date (Europe/Madrid)."

      - name: Comprobación final de derechos antes de publicar
        id: monetization_gate
        if: steps.local_time.outputs.run_now == 'true' && success()
        env:
          VOICE_LICENSE_CONFIRMED: ${{ secrets.VOICE_COMMERCIAL_LICENSE_CONFIRMED }}
          SOURCES_VERIFIED: ${{ secrets.RESEARCH_SOURCES_VERIFIED }}
          VISUAL_LICENSES_VERIFIED: ${{ secrets.VISUAL_LICENSES_VERIFIED }}
        run: |
          allowed=true
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Ejecución de validación en rama aislada: publicación deshabilitada."
            allowed=false
          fi
          if [ "$VOICE_LICENSE_CONFIRMED" != "yes" ]; then
            echo "::warning::Publicación bloqueada: falta confirmar por escrito la licencia comercial de la voz."
            allowed=false
          fi
          if [ "$SOURCES_VERIFIED" != "yes" ]; then
            echo "::warning::Publicación bloqueada: falta verificar las fuentes documentales del episodio."
            allowed=false
          fi
          if [ "$VISUAL_LICENSES_VERIFIED" != "yes" ]; then
            echo "::warning::Publicación bloqueada: falta revisar licencias y derechos de terceros de los recursos visuales."
            allowed=false
          fi
          echo "publish_allowed=$allowed" >> "$GITHUB_OUTPUT"
          if [ "$allowed" = "true" ]; then
            echo "Controles documentales y de derechos confirmados."
          else
            echo "El vídeo se conservará como artefacto privado de revisión; no se programará en YouTube."
          fi

      - name: Programar documental públicamente en YouTube
        id: youtube_publish
        if: steps.local_time.outputs.run_now == 'true' && success() && steps.monetization_gate.outputs.publish_allowed == 'true'
        uses: Upload-Post/upload-post-action@v1
        with:
          api-key: ${{ secrets.UPLOAD_POST_API_KEY }}
          profile: default
          type: video
          platforms: youtube
          media: ${{ steps.karaoke_subtitles.outputs.video_path }}
          text: ${{ steps.youtube_assets.outputs.title }}
          scheduled-date: ${{ steps.publish_time.outputs.scheduled_date }}
          timezone: Europe/Madrid
          extra: |
            {
              "privacyStatus": "public",
              "youtube_title": ${{ steps.youtube_assets.outputs.title_json }},
              "youtube_description": ${{ steps.youtube_assets.outputs.description_json }},
              "tags": ${{ steps.youtube_assets.outputs.tags_json }},
              "thumbnail": "${{ steps.youtube_assets.outputs.thumbnail_path }}"
            }

      - name: Resumen de la generación
        if: steps.local_time.outputs.run_now == 'true' && success()
        run: |
          echo "## Caspitas: documental generado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tema: $(cat output/tema.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Proveedor/modelo de guion: $(cat output/modelo.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duración: $(python3 -c 'print(round(float(open("output/duration_seconds.txt").read())/60, 1))') minutos" >> "$GITHUB_STEP_SUMMARY"
          echo "- Control técnico: $(python3 -c 'import json; print(json.load(open("output/qa_report.json"))["status"])')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sincronización A/V: $(python3 -c 'import json; print(json.load(open("output/qa_report.json"))["audio_video_drift_seconds"])') segundos de diferencia" >> "$GITHUB_STEP_SUMMARY"
          echo "- Subtítulos: $(python3 -c 'import json; print(json.load(open("output/qa_report.json"))["subtitle_cues"])') cues revisados; comprobar también la escucha final" >> "$GITHUB_STEP_SUMMARY"
          echo "- FFmpeg: preset veryfast y CRF 23; subtítulos ASS por frases con resaltado de palabra activa" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voz: es-ES-AlvaroNeural (Edge TTS)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Subtítulos: frases cortas con resaltado karaoke sincronizado por palabra; fondo oscuro y borde legible" >> "$GITHUB_STEP_SUMMARY"
          echo "- Música: desactivada temporalmente; no se usará música aleatoria sin licencia verificada" >> "$GITHUB_STEP_SUMMARY"
          echo "- Efectos: sonidos originales sintetizados por código, mezcla suave y sin bibliotecas externas; revisar auditivamente." >> "$GITHUB_STEP_SUMMARY"
          echo "- Mapas: marcador geocodificado animado solo cuando el lugar y la fuente OSM se han podido verificar; sin rutas inventadas." >> "$GITHUB_STEP_SUMMARY"
          echo "- 2.5D: fondo y primer plano en capas, zoom lento y desplazamiento independiente; escenas renderizadas durante toda su duración." >> "$GITHUB_STEP_SUMMARY"
          echo "- Continuidad: identidad Caspitas Explorer bloqueada entre recreaciones ilustradas." >> "$GITHUB_STEP_SUMMARY"
          echo "- Storyboard QA: $(python3 -c 'import json; print(json.load(open("output/storyboard_qa_report.json"))["status"])') — base literal, licencias y procedencia." >> "$GITHUB_STEP_SUMMARY"
          echo "- Informe SFX: output/sfx_report.json y output/sfx_qa_report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuentes: el guion solicita referencias; deben comprobarse manualmente, no existe verificación automática independiente." >> "$GITHUB_STEP_SUMMARY"
          echo "- Voz Edge TTS: derechos comerciales no confirmados; no considerar monetización verificada." >> "$GITHUB_STEP_SUMMARY"
          echo "- Derechos visuales: revisar origen, licencia y derechos de terceros de cada recurso Pixabay." >> "$GITHUB_STEP_SUMMARY"
          echo "- Publicación autorizada por los controles de derechos: ${{ steps.monetization_gate.outputs.publish_allowed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revisión de monetización: pendiente de verificación editorial y de derechos." >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuente visual: Pixabay" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.monetization_gate.outputs.publish_allowed }}" = "true" ]; then
            echo "- YouTube: publicación pública programada para ${{ steps.publish_time.outputs.scheduled_date }} (Europe/Madrid)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Estado de programación: ${{ steps.youtube_publish.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Trabajo de Upload-Post: ${{ steps.youtube_publish.outputs.job-id }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- YouTube: NO publicado ni programado; los controles de derechos siguen pendientes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir vídeo y datos como artefacto descargable
        if: steps.local_time.outputs.run_now == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: caspitas-documental-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 14
