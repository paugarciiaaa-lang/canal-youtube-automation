name: Test del motor visual híbrido

on:
  push:
    branches:
      - caspitas-2.0-hybrid-test

permissions:
  contents: read

jobs:
  test-hybrid-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg y Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip pillow

      - name: Renderizar prueba cinematográfica 2D Caspitas (8 segundos)
        run: |
          python3 -m py_compile scripts/caspitas_comic_animation_prototype_v4.py
          python3 scripts/caspitas_comic_animation_prototype_v4.py

      - name: Compilar y ejecutar pruebas unitarias
        run: |
          python3 -m py_compile scripts/hybrid_visual_engine.py scripts/semantic_storyboard.py scripts/research_visual_assets.py scripts/competitor_benchmark.py
          python3 -m unittest discover -s tests -v

      - name: Crear documental sintético de tres minutos
        run: |
          mkdir -p smoke
          ffmpeg -y -loglevel error \
            -f lavfi -i "color=c=0x15202b:s=1920x1080:r=24" \
            -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=48000" \
            -t 180 -shortest -c:v libx264 -preset ultrafast -crf 30 \
            -pix_fmt yuv420p -c:a aac smoke/base.mp4
          cat > smoke/test.srt <<'SRT'
          1
          00:00:00,000 --> 00:00:50,000
          En 1981 el investigador llegó a la estación.

          2
          00:00:50,000 --> 00:01:40,000
          El expediente contenía una carta y una prueba.

          3
          00:01:40,000 --> 00:03:00,000
          La expedición avanzó por la montaña.
          SRT
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          Path("smoke").mkdir(exist_ok=True)
          for name, title in [("map.png","TEST MAP SOURCE"),("document.png","TEST ARCHIVE SOURCE"),("photo.png","TEST PHOTO SOURCE")]:
              image=Image.new("RGB",(1000,600),(225,230,226))
              draw=ImageDraw.Draw(image)
              draw.rectangle((30,30,970,570),outline=(45,60,75),width=8)
              draw.text((80,100),title,fill=(30,40,50))
              image.save(Path("smoke")/name)
          scenes=[
            {"index":1,"start":5,"duration":4.5,"type":"timeline","label":"Cronología","excerpt":"En 1981 el investigador llegó a la estación.","years":["1981"],"confidence":0.9,"factual_basis":"En 1981 el investigador llegó a la estación."},
            {"index":2,"start":50,"duration":4.5,"type":"map","label":"Mapa de prueba","excerpt":"La expedición avanzó por la montaña.","asset_path":"smoke/map.png","asset":{"attribution":"TEST SOURCE"},"confidence":0.9,"factual_basis":"La expedición avanzó por la montaña."},
            {"index":3,"start":95,"duration":4.5,"type":"document","label":"Documento","excerpt":"El expediente contenía una carta y una prueba.","asset_path":"smoke/document.png","asset":{"license":"TEST CC0"},"confidence":0.9,"factual_basis":"El expediente contenía una carta y una prueba."},
            {"index":4,"start":140,"duration":4.5,"type":"parallax","label":"Parallax","excerpt":"La expedición avanzó por la montaña.","asset_path":"smoke/photo.png","asset":{"license":"TEST CC0"},"confidence":0.9,"factual_basis":"La expedición avanzó por la montaña."}
          ]
          Path("smoke/semantic_plan.json").write_text(json.dumps({"scene_count":len(scenes),"scenes":scenes},ensure_ascii=False),encoding="utf-8")
          PY

      - name: Probar renderizado semántico, capas 2.5D y sincronización
        run: |
          python3 scripts/hybrid_visual_engine.py \
            --video smoke/base.mp4 \
            --srt smoke/test.srt \
            --plan smoke/semantic_plan.json \
            --output smoke/hybrid-preview.mp4 \
            --storyboard smoke/storyboard.json \
            --interval 55 \
            --scene-seconds 4.5
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          data = json.loads(Path("smoke/storyboard.json").read_text(encoding="utf-8"))
          assert data["scene_count"] == 4, data
          assert data["planner"] == "semantic", data
          assert data["audio_preserved"] is True
          assert data["subtitle_timing_preserved"] is True
          def duration(p):
              return float(subprocess.check_output([
                  "ffprobe","-v","error","-show_entries","format=duration",
                  "-of","default=noprint_wrappers=1:nokey=1",p
              ], text=True))
          drift = abs(duration("smoke/base.mp4") - duration("smoke/hybrid-preview.mp4"))
          assert drift < 1.0, drift
          print(f"Smoke test semántico correcto: {data['scene_count']} overlays, assets y parallax; diferencia {drift:.3f}s")
          PY

      - name: Guardar muestra técnica
        uses: actions/upload-artifact@v4
        with:
          name: caspitas-hybrid-smoke-test
          path: |
            smoke/hybrid-preview.mp4
            smoke/storyboard.json
            smoke/semantic_plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Guardar prototipo cinematográfico Caspitas
        uses: actions/upload-artifact@v4
        with:
          name: caspitas-comic-animation-prototype-v4
          path: output/caspitas-comic-prototype/caspitas-comic-animation-prototype.mp4
          if-no-files-found: error
          retention-days: 7
