name: Caspitas visual engine - CI

on:
  push:
    branches:
      - caspitas-visual-validation
    paths:
      - "scripts/hybrid_visual_engine.py"
      - "tests/test_hybrid_visual_engine.py"
      - ".github/workflows/visual-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile visual engine
        run: python -m py_compile scripts/hybrid_visual_engine.py
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Run focused visual tests
        run: python -m unittest discover -s tests -p "test_hybrid_visual_engine.py" -v
